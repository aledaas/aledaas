    <g transform="translate(330 505)"><rect width="540" height="74" rx="18" fill="#101f38" stroke="#2b405e"/><rect width="8" height="74" rx="4" fill="#70bdd9"/><text x="270" y="47" fill="#f5fbff" font-size="25" font-weight="680">Face</text></g>
